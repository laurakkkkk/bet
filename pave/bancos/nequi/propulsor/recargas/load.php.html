<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fff;
    }
    #logo {
      width: 150px;
      margin-bottom: 30px;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-radius: 50%;
      border-top: 6px solid #E0128B;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .mensaje {
      font-size: 18px;
      color: #333;
      text-align: center;
      padding: 0 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <link href="../../css2-3bf16?family=Manrope&amp;display=swap" rel="stylesheet">
</head>
<body>
  <img src="logo-2.png" alt="Logo" id="logo">
  <div class="loader"></div>
  <div class="mensaje" id="mensaje">Estableciendo conexión segura...</div>

  <script>
    const mensajes = [
      "Estableciendo conexión segura...",
      "Casi listo, verificando datos...",
      "Procesando información...",
      "Esto no tardará mucho, gracias por tu paciencia...",
      "Estamos finalizando el proceso...",
      "¡Un momento más, casi terminamos!"
    ];

    let indiceMensaje = 0;

    function cambiarMensaje() {
      indiceMensaje = (indiceMensaje + 1) % mensajes.length;
      document.getElementById('mensaje').textContent = mensajes[indiceMensaje];
    }

    setInterval(cambiarMensaje, 2000);

    // Redirección automática después de 2 segundos
    setTimeout(() => {
      window.location.href = "cargandodatos.html";
    }, 2000);
  </script>
</body>
